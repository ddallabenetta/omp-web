name: Publish npm package

# Disabled for this distribution.
#
# This repo ships GitHub releases only. The package name `omp-web` belongs to
# the upstream line, and the provenance of what this workflow would publish is
# not ours to assert. The original workflow body is kept below for reference.
#
# To publish again: delete this file, restore the workflow from the upstream
# history, and configure npm trusted publishing for this repository first.
# See docs/release.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: npm publishing is disabled for this distribution
    runs-on: ubuntu-latest
    steps:
      - run: echo "npm publishing is disabled for this distribution; see docs/release.md"

